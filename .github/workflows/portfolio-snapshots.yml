name: Portfolio Daily Snapshots

on:
  schedule:
    - cron: "30 21 * * 1-5"  # Mon-Fri at 9:30 PM UTC (after US market close)
  workflow_dispatch:
    # Note: Only users with write access to the repo can trigger manual runs

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install supabase==2.11.0

      - name: Run snapshot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python backend/snapshot_portfolios.py
