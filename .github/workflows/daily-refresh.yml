name: Daily Data Refresh

on:
  schedule:
    - cron: '0 2 * * 1-5'  # Mon-Fri 2am UTC (9pm ET)
  workflow_dispatch:
    # Note: Only users with write access to the repo can trigger manual runs

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install requests==2.32.3 supabase==2.11.0

      - name: Run daily refresh
        working-directory: backend
        env:
          FMP_KEY: ${{ secrets.FMP_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python3 refresh_daily.py
