name: Generate SEO Pages

on:
  schedule:
    - cron: '0 15 * * 1-5'  # 10am ET (15 UTC) Mon-Fri
  workflow_dispatch:
    # Note: Only users with write access to the repo can trigger manual runs

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: cd backend && pip install jinja2==3.1.4 supabase==2.11.0
      - name: Generate SEO pages
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: cd backend && python seo_generator.py
      - name: Commit and create PR if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f frontend/public/stocks/
          if ! git diff --staged --quiet; then
            BRANCH="chore/seo-pages-$(date +%Y%m%d)"
            git checkout -b "$BRANCH"
            git commit -m "chore: update SEO pages"
            git push origin "$BRANCH"
          fi
