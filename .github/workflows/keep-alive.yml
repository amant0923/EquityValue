name: Keep Render Alive
on:
  schedule:
    - cron: "*/14 * * * *"  # Every 14 minutes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Validate BACKEND_URL secret
        run: |
          if [ -z "${{ secrets.BACKEND_URL }}" ]; then
            echo "::error::BACKEND_URL secret is not set. Add it in Settings > Secrets > Actions."
            exit 1
          fi

      - name: Ping backend
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          # Trim whitespace and trailing slashes
          URL=$(echo "$BACKEND_URL" | xargs | sed 's:/*$::')
          echo "Pinging $URL/health"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$URL/health")
          echo "Health check returned HTTP $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "Backend is healthy"
          else
            echo "::warning::Backend returned HTTP $STATUS — it may be waking up from cold start"
            exit 1
          fi
