name: Keep Render Alive
on:
  schedule:
    - cron: "*/14 * * * *"  # Every 14 minutes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Validate BACKEND_URL secret
        run: |
          if [ -z "${{ secrets.BACKEND_URL }}" ]; then
            echo "::error::BACKEND_URL secret is not set. Add it in Settings > Secrets > Actions."
            exit 1
          fi

      - name: Ping backend
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          URL=$(echo "$BACKEND_URL" | xargs | sed 's:/*$::')
          # Any HTTP response keeps Render alive — only fail on connection errors
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$URL/health") || true
          echo "Health check returned HTTP $STATUS"
          if [ "$STATUS" = "000" ]; then
            echo "::error::Could not connect to backend — check BACKEND_URL and Render service status"
            exit 1
          fi
          echo "Ping successful (HTTP $STATUS) — backend is alive"
