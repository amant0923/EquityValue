name: Quarterly Data Refresh

on:
  schedule:
    - cron: '0 6 8 1,4,7,10 *'  # 8th of Jan/Apr/Jul/Oct, 6am UTC
  workflow_dispatch:
    # Note: Only users with write access to the repo can trigger manual runs

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install requests==2.32.3 supabase==2.11.0

      - name: Run quarterly refresh
        working-directory: backend
        env:
          FMP_KEY: ${{ secrets.FMP_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python3 refresh_quarterly.py
