name: Weekly Data Refresh

on:
  schedule:
    - cron: '0 4 * * 0'  # Sunday 4am UTC (midnight ET)
  workflow_dispatch:
    # Note: Only users with write access to the repo can trigger manual runs

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install requests==2.32.3 supabase==2.11.0

      - name: Run weekly refresh
        working-directory: backend
        env:
          FMP_KEY: ${{ secrets.FMP_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python3 refresh_weekly.py
